[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceleakcheck"
version = "0.1.0.dev0"
description = "Prove your AI app's OpenTelemetry export doesn't leak secrets: canary secrets + a local OTLP receiver, in pytest."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-proto>=1.27",
    "protobuf>=5.26",
    "pytest>=8",
]

[project.entry-points.pytest11]
traceleakcheck = "traceleakcheck.plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "pytest-xdist>=3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traceleakcheck"]
