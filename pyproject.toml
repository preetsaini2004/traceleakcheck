[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceleakcheck"
version = "0.1.0.dev0"
description = "Prove your AI app's OpenTelemetry export doesn't leak secrets: canary secrets + a local OTLP receiver, in pytest."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-proto>=1.27",
    "protobuf>=5.26",
    "pytest>=8",
]

[project.entry-points.pytest11]
traceleakcheck = "traceleakcheck.plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "pytest-xdist>=3",
]
# Instrumentation leak survey (survey/). openai<3: 3.x moved to httpx2, which
# opentelemetry-instrumentation-openai-v2 2.4b0 can't import.
survey = [
    "openai>=2,<3",
    "opentelemetry-instrumentation-openai-v2",
    # openai-v2 2.4b0 imports util.genai.instruments, which util-genai 1.2b0+ no longer ships;
    # an unpinned install fails at import (checked 2026-11-01).
    "opentelemetry-util-genai==1.1b0",
    "opentelemetry-instrumentation-openai",
    "openinference-instrumentation-openai",
    "opentelemetry-instrumentation-httpx",
    "logfire",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traceleakcheck"]
