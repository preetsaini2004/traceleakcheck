# OpenTelemetry Collector config that removes secrets from telemetry before it reaches your backend.
# Works for apps in any language: point the app's OTLP exporter at this Collector.
#
# It removes, everywhere a string can carry them (span names and attributes, error events, status
# messages, log bodies and attributes, metric attributes, resource attributes):
#   - well-known key formats: OpenAI/Anthropic (sk-...), AWS (AKIA...), GitHub (gh?_...),
#     Google (AIza...), Slack (xox?-...), JWTs and Bearer tokens
#   - credential query parameters: ?key= ?api_key= ?token= ?password= ?sig= ?X-Amz-Signature=
#     ?X-Goog-Signature= ... (every key the semantic conventions say to redact, and more)
# It can't recognise a secret with no known shape (say, a password a user types). Prove it covers
# your app with: traceleakcheck run --port 4400 --app-endpoint http://127.0.0.1:4318 -- <your app>
#
# Regexes are RE2 and avoid backslashes on purpose ([.] instead of \.), so they need no escaping
# inside OTTL strings. "$$" is how the Collector config writes a literal "$".

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
      grpc:
        endpoint: 127.0.0.1:4317

processors:
  transform/redact-secrets:
    error_mode: ignore # e.g. a log body that's a map, not a string: skip that statement, keep the record
    # Each field gets two rules: well-known key formats, then credential query parameters.
    trace_statements:
      - context: resource
        statements:
          - replace_all_patterns(attributes, "value", "(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}|xox[abpors]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}|(?i:bearer)[[:space:]]+[A-Za-z0-9._~+/=-]{16,})", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "((?i)[?&](key|api[_-]?key|apikey|token|access_token|auth|sig|signature|secret|password|awsaccesskeyid|x-amz-signature|x-amz-credential|x-amz-security-token|x-goog-signature|x-goog-credential)=)[^&[:space:]]+", "$${1}[REDACTED]")
      - context: span
        statements:
          - replace_pattern(name, "(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}|xox[abpors]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}|(?i:bearer)[[:space:]]+[A-Za-z0-9._~+/=-]{16,})", "[REDACTED]")
          - replace_pattern(name, "((?i)[?&](key|api[_-]?key|apikey|token|access_token|auth|sig|signature|secret|password|awsaccesskeyid|x-amz-signature|x-amz-credential|x-amz-security-token|x-goog-signature|x-goog-credential)=)[^&[:space:]]+", "$${1}[REDACTED]")
          - replace_all_patterns(attributes, "value", "(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}|xox[abpors]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}|(?i:bearer)[[:space:]]+[A-Za-z0-9._~+/=-]{16,})", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "((?i)[?&](key|api[_-]?key|apikey|token|access_token|auth|sig|signature|secret|password|awsaccesskeyid|x-amz-signature|x-amz-credential|x-amz-security-token|x-goog-signature|x-goog-credential)=)[^&[:space:]]+", "$${1}[REDACTED]")
          - replace_pattern(status.message, "(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}|xox[abpors]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}|(?i:bearer)[[:space:]]+[A-Za-z0-9._~+/=-]{16,})", "[REDACTED]")
          - replace_pattern(status.message, "((?i)[?&](key|api[_-]?key|apikey|token|access_token|auth|sig|signature|secret|password|awsaccesskeyid|x-amz-signature|x-amz-credential|x-amz-security-token|x-goog-signature|x-goog-credential)=)[^&[:space:]]+", "$${1}[REDACTED]")
      - context: spanevent # exception.message and exception.stacktrace live here
        statements:
          - replace_pattern(name, "(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}|xox[abpors]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}|(?i:bearer)[[:space:]]+[A-Za-z0-9._~+/=-]{16,})", "[REDACTED]")
          - replace_pattern(name, "((?i)[?&](key|api[_-]?key|apikey|token|access_token|auth|sig|signature|secret|password|awsaccesskeyid|x-amz-signature|x-amz-credential|x-amz-security-token|x-goog-signature|x-goog-credential)=)[^&[:space:]]+", "$${1}[REDACTED]")
          - replace_all_patterns(attributes, "value", "(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}|xox[abpors]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}|(?i:bearer)[[:space:]]+[A-Za-z0-9._~+/=-]{16,})", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "((?i)[?&](key|api[_-]?key|apikey|token|access_token|auth|sig|signature|secret|password|awsaccesskeyid|x-amz-signature|x-amz-credential|x-amz-security-token|x-goog-signature|x-goog-credential)=)[^&[:space:]]+", "$${1}[REDACTED]")
    log_statements:
      - context: resource
        statements:
          - replace_all_patterns(attributes, "value", "(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}|xox[abpors]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}|(?i:bearer)[[:space:]]+[A-Za-z0-9._~+/=-]{16,})", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "((?i)[?&](key|api[_-]?key|apikey|token|access_token|auth|sig|signature|secret|password|awsaccesskeyid|x-amz-signature|x-amz-credential|x-amz-security-token|x-goog-signature|x-goog-credential)=)[^&[:space:]]+", "$${1}[REDACTED]")
      - context: log
        statements:
          - replace_pattern(body, "(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}|xox[abpors]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}|(?i:bearer)[[:space:]]+[A-Za-z0-9._~+/=-]{16,})", "[REDACTED]")
          - replace_pattern(body, "((?i)[?&](key|api[_-]?key|apikey|token|access_token|auth|sig|signature|secret|password|awsaccesskeyid|x-amz-signature|x-amz-credential|x-amz-security-token|x-goog-signature|x-goog-credential)=)[^&[:space:]]+", "$${1}[REDACTED]")
          - replace_all_patterns(attributes, "value", "(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}|xox[abpors]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}|(?i:bearer)[[:space:]]+[A-Za-z0-9._~+/=-]{16,})", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "((?i)[?&](key|api[_-]?key|apikey|token|access_token|auth|sig|signature|secret|password|awsaccesskeyid|x-amz-signature|x-amz-credential|x-amz-security-token|x-goog-signature|x-goog-credential)=)[^&[:space:]]+", "$${1}[REDACTED]")
    metric_statements:
      - context: resource
        statements:
          - replace_all_patterns(attributes, "value", "(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}|xox[abpors]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}|(?i:bearer)[[:space:]]+[A-Za-z0-9._~+/=-]{16,})", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "((?i)[?&](key|api[_-]?key|apikey|token|access_token|auth|sig|signature|secret|password|awsaccesskeyid|x-amz-signature|x-amz-credential|x-amz-security-token|x-goog-signature|x-goog-credential)=)[^&[:space:]]+", "$${1}[REDACTED]")
      - context: datapoint
        statements:
          - replace_all_patterns(attributes, "value", "(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}|xox[abpors]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}|(?i:bearer)[[:space:]]+[A-Za-z0-9._~+/=-]{16,})", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "((?i)[?&](key|api[_-]?key|apikey|token|access_token|auth|sig|signature|secret|password|awsaccesskeyid|x-amz-signature|x-amz-credential|x-amz-security-token|x-goog-signature|x-goog-credential)=)[^&[:space:]]+", "$${1}[REDACTED]")

exporters:
  # Your real backend goes here. For the traceleakcheck proof, it's the receiver on TLC_PORT.
  otlphttp:
    endpoint: http://127.0.0.1:${env:TLC_PORT}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/redact-secrets]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: [transform/redact-secrets]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp]
      processors: [transform/redact-secrets]
      exporters: [otlphttp]
