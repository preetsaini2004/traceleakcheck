name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Windows minutes count double on private repos: cover only the oldest and newest Python.
        include:
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest -q

  action:
    # The demo agent leaks on purpose: this job proves the Action fails the build when it should.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
      - id: demo
        uses: ./
        continue-on-error: true
        with:
          args: examples/demo_agent
      - name: Action must have caught the demo leak
        shell: bash
        run: |
          test "${{ steps.demo.outcome }}" = failure
          python -c "import json,sys; s=json.load(open('traceleak-report.json'))['summary']; sys.exit(0 if s['leak']==1 else 1)"

  node:
    # Any-language mode: the Node demo leaks on purpose, so the Action must fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: examples/node_agent
      - id: demo
        uses: ./
        continue-on-error: true
        with:
          command: --secret OPENAI_API_KEY -- node examples/node_agent/app.js
      - name: Action must have caught the Node demo leak
        shell: bash
        run: |
          test "${{ steps.demo.outcome }}" = failure
          python -c "import json,sys; s=json.load(open('traceleak-report.json'))['summary']; sys.exit(0 if s['leak']==1 else 1)"

  collector:
    # Proves examples/collector/redact.yaml: the Node demo's --proof mode leaks through every channel
    # without the Collector, and comes out clean through it.
    runs-on: ubuntu-latest
    env:
      OTELCOL_VERSION: "0.164.0"
      TLC_PORT: "4400"
      PROOF: >-
        --settle 3 --expect traces,logs,metrics --secret OPENAI_API_KEY --secret DB_PASSWORD=password -v
        -- node examples/node_agent/app.js --proof
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: examples/node_agent
      - run: uv sync
      - name: Install otelcol-contrib
        run: |
          f="otelcol-contrib_${OTELCOL_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTELCOL_VERSION}"
          curl -sSfL -O "$base/$f" -O "$base/$f.sha256"
          # The .sha256 file holds only the hash; build the "hash  file" line sha256sum -c expects.
          echo "$(cut -d' ' -f1 "$f.sha256")  $f" | sha256sum -c -
          tar -xzf "$f" otelcol-contrib
      - run: ./otelcol-contrib validate --config examples/collector/redact.yaml
      - name: Without the Collector, --proof must leak
        run: |
          set +e
          uv run traceleakcheck run $PROOF
          test $? -eq 1
      - name: Through the Collector, --proof must be clean
        run: |
          ./otelcol-contrib --config examples/collector/redact.yaml > otelcol.log 2>&1 &
          sleep 3
          uv run traceleakcheck run --port $TLC_PORT --app-endpoint http://127.0.0.1:4318 $PROOF
      - if: failure()
        run: cat otelcol.log || true
