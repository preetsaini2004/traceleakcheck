name: traceleakcheck
description: Fail the build if your app's OpenTelemetry export leaks canary secrets.
branding:
  icon: shield
  color: red

inputs:
  args:
    description: Extra pytest arguments, e.g. a test path or `-n auto`.
    default: ""
  report:
    description: Where to write the JSON report.
    default: traceleak-report.json
  command:
    description: >-
      Check an app in any language instead of running pytest. Arguments for `traceleakcheck run`,
      e.g. `--secret OPENAI_API_KEY -- node app.js`.
    default: ""

outputs:
  report:
    description: Path of the JSON report.
    value: ${{ inputs.report }}

runs:
  using: composite
  steps:
    # Run in the caller's Python environment, after their dependencies are installed.
    # Inputs go through env, never straight into the script, to avoid shell injection.
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPORT: ${{ inputs.report }}
        ARGS: ${{ inputs.args }}
        COMMAND: ${{ inputs.command }}
      run: |
        python -m pip install --quiet "$ACTION_PATH"
        if [ -n "$COMMAND" ]; then
          # shlex keeps quoted arguments (e.g. --drive "curl ...") together, with no shell eval.
          python -c 'import os, shlex, sys; from traceleakcheck.cli import main; sys.exit(main(["run", "--report", os.environ["REPORT"], *shlex.split(os.environ["COMMAND"])]))'
        else
          # $ARGS is deliberately unquoted so it splits into separate pytest arguments.
          python -m pytest --traceleak --traceleak-report="$REPORT" $ARGS
        fi
